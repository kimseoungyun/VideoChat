# Local monitoring stack (docker compose --profile monitoring up). In production add
# `authorization: {credentials: <METRICS_TOKEN>}` and scrape every Daphne process.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: videochat
    metrics_path: /metrics/
    static_configs:
      - targets: ['web:8000']
