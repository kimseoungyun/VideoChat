name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      BASE_URL: http://127.0.0.1:8017/chat/
      DJANGO_DEBUG: '1'  # debug is off unless asked for
      # Every test browser shares 127.0.0.1; the limits themselves are covered by server tests.
      WS_CONNECT_RATE: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backend/manage.py check && python backend/manage.py makemigrations --check --dry-run
      - name: Translations compiled from the committed .po files
        run: |
          pip install babel==2.17.0
          python scripts/messages.py missing
          python scripts/messages.py compile
          git diff --exit-code backend/locale
      - run: python backend/manage.py test chat main
      - run: python backend/manage.py collectstatic --noinput
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Browser flow
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py runserver 127.0.0.1:8017 --noreload > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8017/health/; then break; fi
            sleep 1
          done
          pnpm test:e2e
          pnpm test:interop
          pnpm test:resilience | tee test-results/resilience.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            server.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Development compose (runserver + Redis)
        run: |
          docker compose up -d --build --wait
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/chat/
          docker compose down
      - name: Monitoring stack (rules valid, Prometheus scrapes, Grafana provisions the dashboard)
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.1.0 check rules /m/alerts.yml
          docker compose --profile monitoring up -d --build --wait
          query='http://127.0.0.1:9090/api/v1/query?query=videochat_ws_active'
          for attempt in $(seq 1 40); do
            if curl -fs "$query" | grep -q '"result":\[{'; then break; fi
            sleep 3
          done
          curl -fs "$query" | grep -q '"result":\[{'
          curl -fs http://127.0.0.1:9090/api/v1/rules | grep -q CallSetupFailing
          for attempt in $(seq 1 30); do
            if curl -fs 'http://127.0.0.1:3000/api/search?query=VideoChat' | grep -q videochat-overview; then break; fi
            sleep 2
          done
          curl -fs 'http://127.0.0.1:3000/api/search?query=VideoChat' | grep -q videochat-overview
          docker compose --profile monitoring down
      - name: Production image (Daphne, DEBUG=0) with real WebSocket matching
        run: |
          docker build -t videochat .
          docker run -d --name redis --network host redis:7.4-alpine
          docker run -d --name web --network host \
            -e DJANGO_DEBUG=0 -e DJANGO_SECRET_KEY="$(openssl rand -hex 40)" \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1 -e TRUST_PROXY=1 \
            -e REDIS_URL=redis://127.0.0.1:6379/0 -e METRICS_TOKEN=ci-token \
            -e WS_MAX_PER_IP=1000 -e WS_CONNECT_RATE=1000 videochat
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/metrics/)" = 404
          curl --fail --silent -H 'X-Forwarded-Proto: https' -H 'Authorization: Bearer ci-token' \
            http://127.0.0.1:8000/metrics/ | grep -q videochat_ws_active
          pip install websockets==15.0.1
          python loadtest/matching.py --base http://127.0.0.1:8000 --clients 200 --ramp 2 | tee result.json
          python -c "import json; r = json.load(open('result.json')); assert r['correctly_paired_pct'] == 100, r"
      - if: failure()
        run: docker compose --profile monitoring logs; docker logs web || true
